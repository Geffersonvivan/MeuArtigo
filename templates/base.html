<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meu Artigo{% endblock %}</title>
  <style>
    /* ---------- Tokens ---------- */
    :root {
      color-scheme: dark;
      --bg:        #0a0b0f;
      --bg-glow:   #141a2e;
      --surface:   rgba(255,255,255,0.024);
      --surface-2: rgba(255,255,255,0.05);
      --border:    rgba(255,255,255,0.08);
      --border-2:  rgba(255,255,255,0.14);
      --ink:       #f3f5f9;
      --ink-2:     #b9c1ce;
      --ink-3:     #7a828f;
      --accent:    #6c8cff;
      --accent-2:  #8aa2ff;
      --accent-ink:#0b1020;
      --ok:        #4ade80;
      --danger:    #ff7a7a;
      --warn:      #ffcb6b;
      --shadow:    0 1px 2px rgba(0,0,0,.5), 0 12px 32px -8px rgba(0,0,0,.55);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --r-lg: 18px; --r-md: 12px; --r-sm: 9px; --pill: 999px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg:        #f6f7f9;
        --bg-glow:   #e6ecff;
        --surface:   #ffffff;
        --surface-2: #ffffff;
        --border:    rgba(9,12,20,0.08);
        --border-2:  rgba(9,12,20,0.16);
        --ink:       #0d1017;
        --ink-2:     #434b58;
        --ink-3:     #79808d;
        --accent:    #3d5afe;
        --accent-2:  #5b73ff;
        --accent-ink:#ffffff;
        --shadow:    0 1px 2px rgba(16,24,40,.06), 0 12px 28px -10px rgba(16,24,40,.18);
        --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
      }
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font: 400 15.5px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      background-image:
        radial-gradient(1100px 520px at 78% -8%, var(--bg-glow), transparent 60%),
        radial-gradient(900px 500px at 10% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }
    ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

    /* ---------- Header (translucent, sticky) ---------- */
    header.site {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px clamp(20px, 4vw, 40px);
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }
    header.site .brand { font-weight: 640; font-size: 16px; letter-spacing: -0.01em; }
    header.site .brand a { color: var(--ink); }

    main { max-width: 880px; margin: 0 auto; padding: clamp(28px, 5vw, 52px) clamp(20px, 4vw, 40px) 96px; }

    /* ---------- Typography ---------- */
    h1 { font-size: clamp(1.7rem, 3.2vw, 2.15rem); font-weight: 680; line-height: 1.1; letter-spacing: -0.025em; margin: 0 0 6px; }
    h2 { font-size: 1.22rem; font-weight: 640; line-height: 1.25; letter-spacing: -0.015em; margin: 0; }
    .muted { color: var(--ink-3); }
    .dim   { color: var(--ink-2); }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 17px; border-radius: var(--r-sm); border: 1px solid transparent;
      font: inherit; font-weight: 590; font-size: 14.5px; letter-spacing: -0.01em; cursor: pointer;
      color: var(--accent-ink);
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.22);
      transition: transform .11s cubic-bezier(.2,.7,.2,1), filter .15s ease, box-shadow .15s ease;
      -webkit-user-select: none; user-select: none; white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.06); text-decoration: none; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }
    .btn.ghost {
      background: var(--surface-2); color: var(--ink);
      border-color: var(--border-2); box-shadow: var(--shadow-sm);
    }
    .btn.ghost:hover { filter: none; background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .btn.sm { padding: 6px 12px; font-size: 13px; }

    /* ---------- Cards / surfaces ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 0; }

    /* ---------- Pills / tags ---------- */
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: var(--pill); font-size: 12px; font-weight: 550; letter-spacing: .01em;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2);
    }

    /* ---------- Messages ---------- */
    .msg {
      padding: 11px 15px; border-radius: var(--r-md); margin-bottom: 14px;
      border: 1px solid var(--border); background: var(--surface-2); font-size: 14px;
      display: flex; gap: 9px; align-items: center;
    }
    .msg.success { border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); }
    .msg.error   { border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }

    /* ---------- Forms ---------- */
    form.stacked label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 7px; letter-spacing: -0.01em; }
    input, select, textarea {
      width: 100%; padding: 11px 13px; border-radius: var(--r-sm);
      border: 1px solid var(--border-2); background: var(--surface-2); color: var(--ink);
      font: inherit; font-size: 15px; transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    ::placeholder { color: var(--ink-3); }
    form.stacked .help { color: var(--ink-3); font-size: 13px; margin-top: 5px; }
    .errorlist { color: var(--danger); list-style: none; padding: 0; margin: 7px 0 0; font-size: 13.5px; }

    /* ---------- Definition list (meta) ---------- */
    dl.meta { display: grid; grid-template-columns: 150px 1fr; gap: 11px 20px; margin: 0; }
    dl.meta dt { color: var(--ink-3); font-size: 14px; }
    dl.meta dd { margin: 0; color: var(--ink); }

    code {
      background: var(--surface-2); padding: 2px 7px; border-radius: 6px;
      border: 1px solid var(--border); font-size: 13px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .empty { text-align: center; color: var(--ink-3); padding: 64px 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

    /* ---------- Prose (artigo renderizado) ---------- */
    .prose { color: var(--ink); font-size: 16.5px; line-height: 1.75; max-width: 68ch; }
    .prose h1 { font-size: 1.7rem; margin: 0 0 .6em; letter-spacing: -0.025em; }
    .prose h2 { font-size: 1.28rem; margin: 1.7em 0 .5em; letter-spacing: -0.015em; }
    .prose h3 { font-size: 1.08rem; margin: 1.4em 0 .4em; font-weight: 640; }
    .prose p { margin: 0 0 1.05em; }
    .prose ul, .prose ol { margin: 0 0 1.05em; padding-left: 1.3em; }
    .prose li { margin: .3em 0; }
    .prose blockquote {
      margin: 1.2em 0; padding: .3em 1.1em; border-left: 3px solid var(--accent);
      color: var(--ink-2); background: var(--surface-2); border-radius: 0 8px 8px 0;
    }
    .prose a { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    .prose strong { font-weight: 650; }

    /* ---------- Motion / a11y ---------- */
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: filter .15s ease; }
      .btn:active { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      header.site { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    @media (prefers-contrast: more) {
      :root { --border: rgba(255,255,255,.24); --border-2: rgba(255,255,255,.36); }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site">
    <div class="brand"><a href="/workspace/app/">✍︎&nbsp; Meu Artigo</a></div>
    <nav><a class="btn" href="/workspace/app/">Abrir workspace</a></nav>
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
